<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f3eb" />
    <title>PawPass Dijital Kimlik</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #f7f3eb; color: #143d37; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { max-width: 560px; margin: 0 auto; padding: 30px 20px 50px; }
      .brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 900; }
      .mark { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 15px; background: #173f3b; color: white; }
      .card { margin-top: 28px; padding: 28px; border-radius: 30px; background: white; box-shadow: 0 18px 60px #143d3718; }
      .hero { display: grid; width: 76px; height: 76px; place-items: center; border-radius: 24px; background: #dceee8; font-size: 38px; }
      h1 { margin: 18px 0 4px; font-size: 34px; }
      .sub { margin-bottom: 18px; color: #57706b; font-size: 17px; }
      .row { padding: 16px 0; border-top: 1px solid #e8eeeb; }
      .label { color: #78908a; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
      .value { margin-top: 5px; font-size: 18px; font-weight: 700; overflow-wrap: anywhere; }
      .notice { margin-top: 18px; padding: 16px; border-radius: 18px; background: #fff1ec; color: #98442f; }
      .status { padding: 56px 20px; text-align: center; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span class="mark">🐾</span>PawPass</div>
      <div id="status" class="status">Kimlik hazırlanıyor…</div>
      <section id="card" class="card" hidden>
        <div class="hero">🐾</div>
        <h1 id="name"></h1>
        <div id="subtitle" class="sub"></div>
        <div id="rows"></div>
        <div class="notice">Bu güvenli kimlik PawPass üzerinden paylaşılmıştır.</div>
      </section>
    </main>
    <script>
      const endpoint = "https://wkceacslqptzleskvaay.supabase.co/functions/v1/pet-card";
      const id = new URLSearchParams(location.search).get("id") || "";
      const status = document.querySelector("#status");
      const card = document.querySelector("#card");
      const labels = [
        ["birthDate", "Doğum tarihi"],
        ["gender", "Cinsiyet"],
        ["microchip", "Mikroçip"],
        ["emergencyPhone", "Acil iletişim"],
        ["allergies", "Alerjiler"],
        ["medications", "Düzenli ilaçlar"],
      ];
      const addRow = (label, value) => {
        if (value === null || value === undefined) return;
        const row = document.createElement("div");
        row.className = "row";
        const labelNode = document.createElement("div");
        labelNode.className = "label";
        labelNode.textContent = label;
        const valueNode = document.createElement("div");
        valueNode.className = "value";
        valueNode.textContent = String(value || "Belirtilmedi");
        row.append(labelNode, valueNode);
        document.querySelector("#rows").append(row);
      };
      fetch(`${endpoint}?id=${encodeURIComponent(id)}`)
        .then(async (response) => {
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "Kimlik bulunamadı");
          return data;
        })
        .then((data) => {
          document.title = `${data.name} • PawPass`;
          document.querySelector("#name").textContent = data.name || "PawPass";
          document.querySelector("#subtitle").textContent = [data.species, data.breed].filter(Boolean).join(" • ");
          labels.forEach(([key, label]) => addRow(label, data[key]));
          status.hidden = true;
          card.hidden = false;
        })
        .catch((error) => { status.textContent = error.message || "Kimlik açılamadı."; });
    </script>
  </body>
</html>
